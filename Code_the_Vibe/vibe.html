<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Gallery</title>

<style>
:root {
    --bg: #f4f4f4;
    --card-bg: #ffffff;
    --text: #222;
    --accent: #4f46e5;
    --shadow: rgba(0,0,0,0.12);
}

body.dark {
    --bg: #121212;
    --card-bg: #1e1e1e;
    --text: #f5f5f5;
    --accent: #818cf8;
    --shadow: rgba(0,0,0,0.4);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: background 0.3s ease, color 0.3s ease;
    min-height: 100vh;
}

.header {
    display: flex;
    justify-content: flex-end;
    padding: 20px;
}

.theme-toggle {
    border: none;
    background: var(--accent);
    color: white;
    padding: 10px 18px;
    border-radius: 999px;
    cursor: pointer;
    font-weight: bold;
    transition: transform 0.2s ease;
}

.theme-toggle:hover {
    transform: scale(1.05);
}

.gallery {
    max-width: 1200px;
    margin: 40px auto;
    padding: 20px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 24px;
}

.card {
    background: var(--card-bg);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 10px 25px var(--shadow);
    transition:
        transform 0.35s ease,
        box-shadow 0.35s ease;
    
    opacity: 0;
    transform: translateY(40px);
    animation: fadeUp 0.8s forwards;
}

.card:nth-child(2) {
    animation-delay: 0.2s;
}

.card:nth-child(3) {
    animation-delay: 0.4s;
}

.card:hover {
    transform: translateY(-10px);
    box-shadow: 0 20px 40px var(--shadow);
}

.image-wrapper {
    overflow: hidden;
}

.card img {
    width: 100%;
    height: 240px;
    object-fit: cover;
    display: block;
    transition: transform 0.5s ease;
}

.card:hover img {
    transform: scale(1.08);
}

.card-content {
    padding: 20px;
}

.card h3 {
    margin-bottom: 10px;
}

.card p {
    opacity: 0.8;
    margin-bottom: 15px;
    line-height: 1.5;
}

.price {
    font-size: 1.2rem;
    font-weight: bold;
    color: var(--accent);
}

.buy-btn {
    margin-top: 15px;
    border: none;
    background: var(--accent);
    color: white;
    padding: 10px 16px;
    border-radius: 10px;
    cursor: pointer;
    transition: opacity 0.3s ease;
}

.buy-btn:hover {
    opacity: 0.9;
}

@keyframes fadeUp {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>
</head>
<body>

<div class="header">
    <button class="theme-toggle" id="themeBtn">
        🌙 Dark Mode
    </button>
</div>

<div class="gallery">

    <div class="card">
        <div class="image-wrapper">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=800"
                 alt="Sneakers">
        </div>
        <div class="card-content">
            <h3>Premium Sneakers</h3>
            <p>Lightweight and stylish shoes for everyday comfort.</p>
            <div class="price">$89</div>
            <button class="buy-btn">Buy Now</button>
        </div>
    </div>

    <div class="card">
        <div class="image-wrapper">
            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=800"
                 alt="Watch">
        </div>
        <div class="card-content">
            <h3>Smart Watch</h3>
            <p>Track fitness, notifications, and health metrics.</p>
            <div class="price">$149</div>
            <button class="buy-btn">Buy Now</button>
        </div>
    </div>

    <div class="card">
        <div class="image-wrapper">
            <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=800"
                 alt="Headphones">
        </div>
        <div class="card-content">
            <h3>Wireless Headphones</h3>
            <p>Immersive sound with noise cancellation technology.</p>
            <div class="price">$199</div>
            <button class="buy-btn">Buy Now</button>
        </div>
    </div>

</div>

<script>
const themeBtn = document.getElementById("themeBtn");

themeBtn.addEventListener("click", () => {
    document.body.classList.toggle("dark");

    if (document.body.classList.contains("dark")) {
        themeBtn.textContent = "☀️ Light Mode";
    } else {
        themeBtn.textContent = "🌙 Dark Mode";
    }
});
</script>

</body>
</html>
