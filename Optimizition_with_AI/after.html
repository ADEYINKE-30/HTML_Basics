<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f5f5f5;
    font-family: Arial, sans-serif;
}

.pricing-card {
    width: 300px;
    background: #fff;
    box-shadow: 0 0 10px rgba(0,0,0,0.15);
    border-radius: 8px;
    padding: 20px;
}

.pricing-card__title {
    margin: 0 0 10px;
    font-size: 22px;
    font-weight: bold;
}

.pricing-card__price {
    font-size: 18px;
    color: green;
    margin-bottom: 15px;
}

.pricing-card__features {
    list-style: none;
    padding: 0;
    margin: 0;
}

.pricing-card__features li {
    padding: 8px 0;
    border-bottom: 1px solid #eee;
}

.pricing-card__button {
    width: 100%;
    margin-top: 16px;
    padding: 12px;
    border: none;
    border-radius: 4px;
    background: blue;
    color: white;
    cursor: pointer;
}

.pricing-card__button:hover {
    background: darkblue;
}
</style>
</head>
<body>

<div id="app"></div>

<script>
function Card(title, price, features) {
    return `
        <div class="pricing-card">
            <h2 class="pricing-card__title">${title}</h2>
            <p class="pricing-card__price">${price}</p>

            <ul class="pricing-card__features">
                ${features.map(feature => `<li>${feature}</li>`).join("")}
            </ul>

            <button class="pricing-card__button">
                Start Trial
            </button>
        </div>
    `;
}

document.getElementById("app").innerHTML =
    Card(
        "Basic Plan",
        "$9.99 / month",
        [
            "1 GB Storage",
            "Basic Support",
            "All Core Features"
        ]
    );
</script>

</body>
</html>
